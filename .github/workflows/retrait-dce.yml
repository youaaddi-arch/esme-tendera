# Retrait d'un dossier de consultation sur un profil d'acheteur.
#
# Les plateformes de dépôt — AW Solutions, PLACE, Maximilien — n'exposent pas
# d'API et servent une application JavaScript : le dossier ne s'obtient qu'en
# naviguant, donc avec un vrai navigateur. Vercel n'en a pas, et ses fonctions
# sont bornées à une minute : ce retrait ne peut pas s'exécuter là-bas.
#
# Il tourne donc ici, à la demande, sur une consultation précise. Deux secrets
# de dépôt sont nécessaires :
#   AWS_LOGIN     — identifiant du compte opérateur économique
#   AWS_PASSWORD  — son mot de passe
#
# Le dossier récupéré est déposé en artefact de l'exécution. Il n'est pas
# publié : seuls les collaborateurs du dépôt peuvent le télécharger, et il
# expire au bout de sept jours.
name: Retrait DCE

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse de retrait du DCE, telle que l'avis BOAMP la publie"
        required: true
        type: string
      auth:
        description: "Adresse de la consultation menant à l'authentification (la page DCE n'a pas de formulaire)"
        required: false
        type: string
      explorer:
        description: "Pages de l'application à décrire après connexion, séparées par des virgules"
        required: false
        type: string
      mode:
        description: "diagnostic : ouvre la session et décrit la page, sans rien télécharger"
        required: false
        default: retrait
        type: choice
        options: [retrait, diagnostic]

jobs:
  retirer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer le navigateur
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: Retirer le dossier
        env:
          AWS_LOGIN: ${{ secrets.AWS_LOGIN }}
          AWS_PASSWORD: ${{ secrets.AWS_PASSWORD }}
        run: |
          if [ -z "$AWS_LOGIN" ] || [ -z "$AWS_PASSWORD" ]; then
            echo "Secrets AWS_LOGIN et AWS_PASSWORD absents du dépôt." >&2
            exit 1
          fi
          if [ -n "${{ inputs.auth }}" ]; then
            node scripts/retrait-dce.mjs --url "${{ inputs.url }}" --auth "${{ inputs.auth }}" \
              --explorer "${{ inputs.explorer }}" --mode "${{ inputs.mode }}"
          else
            node scripts/retrait-dce.mjs --url "${{ inputs.url }}" --mode "${{ inputs.mode }}"
          fi

      - name: Conserver le dossier et les traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrait-dce
          path: retrait-dce/
          retention-days: 7
          if-no-files-found: warn
